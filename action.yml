name: setup-msvc-env
description: Setup MSVC environment variables

inputs:
  arch:
    description: Target architecture
    required: false
    default: ""
  sdk:
    description: Windows SDK version
    required: false
    default: ""
  toolset:
    description: VC++ compiler toolset version
    required: false
    default: ""
  uwp:
    description: Set the platform type to 'uwp' ('store')
    required: false
    default: "false"
  spectre:
    description: Use libraries without Spectre mitigations
    required: false
    default: "false"
  vsversion:
    description: Visual Studio version
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: pwsh
      run: |
        & "$env:GITHUB_ACTION_PATH/setup-msvc-env.ps1" `
            -Arch "${{ inputs.arch }}" `
            -Sdk "${{ inputs.sdk }}" `
            -Toolset "${{ inputs.toolset }}" `
            -Uwp "${{ inputs.uwp }}" `
            -Spectre "${{ inputs.spectre }}" `
            -VsVersion "${{ inputs.vsversion }}"
